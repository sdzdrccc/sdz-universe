[package]
name = "sdz-universe"
version = "0.1.0"
description = "SDZ Universe - 个人收藏工作台（书籍/动漫/小说/游戏/应用/大模型）"
authors = ["sdz"]
edition = "2021"

[lib]
name = "sdz_universe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
